# SecCraft static frontend + same-origin API reverse proxy. Terminate TLS at the ingress/load balancer;
# this container listens on HTTP only and must not be exposed directly to an untrusted network.
worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
  gzip_comp_level 5;

  limit_req_zone $binary_remote_addr zone=seccraft_api:10m rate=100r/m;
  limit_req_status 429;

  upstream seccraft_api {
    server api:8000;
    keepalive 16;
  }

  server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location /api/ {
      limit_req zone=seccraft_api burst=30 nodelay;
      proxy_pass http://seccraft_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    location = /index.html {
      expires -1;
    }
    location = /sw.js {
      expires -1;
    }
    location = /manifest.json {
      expires 1d;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
