# WiFiForge — Enterprise Nginx • TLS • gzip • cache • rate limit • production
worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Gzip production
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
  gzip_comp_level 6;

  # Rate limit — enterprise 100 req/min per IP
  limit_req_zone $binary_remote_addr zone=wififorge:10m rate=100r/m;
  limit_req_status 429;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;

  upstream backend {
    server wififorge:8000;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name wififorge.local;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Frontend — PWA cache
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      # No cache for index.html
      location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      }
      location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      }
      location = /manifest.json {
        add_header Cache-Control "public, max-age=86400" always;
      }
    }

    # API — rate limited
    location /api/ {
      limit_req zone=wififorge burst=20 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      # No cache API
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Health
    location /api/health {
      proxy_pass http://backend;
      access_log off;
    }

    # Evidence vault — protected
    location /evidence/ {
      limit_req zone=wififorge burst=10 nodelay;
      proxy_pass http://backend;
      internal;
    }
  }
}
