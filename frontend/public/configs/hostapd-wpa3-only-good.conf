# Good: WPA3-only (SAE) with PMF required — the reference configuration for module 11.
# Notes:
#  * SAE and the PMF requirement are what remove the offline-guessing path of WPA2-PSK.
#  * sae_pwe=2 (hash-to-element and hunting-and-pecking) keeps older WPA3 clients interoperable;
#    6 GHz deployments require sae_pwe=2.
#  * sae_groups: 19 = P-256, 20 = P-384, 21 = P-521 (elliptic-curve groups; the default set).
#  * Set the regulatory domain correctly for your location — read it first with: iw reg get
interface=wlan0
driver=nl80211
country_code=GB
ssid=LAB-WPA3
hw_mode=a
channel=36
wpa=2
wpa_key_mgmt=SAE
sae_password=StrongRandomPassphrase123!@#With20+Chars
sae_pwe=2
sae_groups=19 20 21
rsn_pairwise=CCMP
group_mgmt_cipher=AES-128-CMAC
ieee80211w=2
wps_state=0
