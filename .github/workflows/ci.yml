name: CI

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — typecheck, verify data, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (lockfile exact)
        run: npm ci
        working-directory: frontend

      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
        working-directory: frontend

      - name: Verify internal frontend routes
        run: node scripts/verify-frontend-routes.mjs

      - name: Verify local progress migration and reward semantics
        run: node scripts/verify-progress-state.mjs

      - name: Validate P3.1 content and catalogue contracts
        run: |
          node scripts/verify-content-contract.mjs
          node --test scripts/tests/content-contract.test.mjs

      # P3.1 is intentionally report-only: current protected-content exposure is known and reviewed
      # before the P3.5 contract gate switches this command to --enforce.
      - name: Report protected-content exposure (non-blocking findings)
        run: node scripts/verify-no-private-content.mjs

      - name: Verify learning journey content contracts
        run: node scripts/verify-learning-data.mjs

      - name: Verify Wireless foundations artifacts and curriculum
        run: python3 scripts/verify-wireless-foundations.py

      - name: Verify Wireless tester workflow and capture interoperability
        run: |
          python3 scripts/verify-labkit-interop.py
          python3 scripts/verify-wireless-phase2.py
          python3 scripts/verify-wireless-phase3.py --openssl
          python3 scripts/verify-wireless-phase4.py
          python3 scripts/verify-wireless-phase5.py
          python3 scripts/verify-wireless-phase6.py
          python3 scripts/verify-wireless-phase7.py
          python3 scripts/verify-wireless-curriculum.py
          npm ci --prefix tools/wireless-qa --ignore-scripts
          node scripts/verify-wireless-wireshark.mjs

      - name: Verify Android source-only exercises and downloads
        run: |
          python3 scripts/verify-android-foundations.py
          python3 scripts/verify-android-demo.py
          python3 scripts/verify-android-cases.py
          python3 scripts/verify-android-curriculum.py

      - name: Test guest API outage and timeout fallback
        run: npm test
        working-directory: frontend

      # The lab datasets and challenge answers are generated artifacts; verify them before shipping
      # rather than trusting the copy in the repository.
      - name: Verify lab artifacts and challenge answers
        run: python3 scripts/verify-lab-artifacts.py

      # Fails if the build or the source reintroduces invented data or third-party requests.
      - name: Verify no dummy data / no external requests
        run: python3 scripts/verify-no-dummy-data.py

      - name: Build (also runs the third-party request audit)
        run: npm run build
        working-directory: frontend

      - name: Verify dry-run migration manifest against built output
        run: |
          node scripts/generate-content-migration-manifest.mjs
          git diff --exit-code -- content/migration/CONTENT_MIGRATION_MANIFEST.json

      - name: Report protected-content exposure in built output
        run: node scripts/verify-no-private-content.mjs

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build and enforce the staging public-content boundary
        run: |
          CONTENT_BOUNDARY_BUILD=1 npm run build --prefix frontend
          node scripts/verify-public-boundary-build.mjs

  backend:
    name: Backend — imports and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r backend/requirements.txt

      - name: Install certificate-generation QA dependency
        run: python -m pip install cryptography==46.0.5

      - name: Independently decode all teaching captures
        run: |
          python scripts/verify-labkit-interop.py --scapy
          python scripts/verify-wireless-phase4.py --scapy
          python scripts/verify-wireless-phase5.py --scapy --cert-generator

      - name: Import check
        run: python -c "from app.main import app; print('app imports:', app.title)"
        working-directory: backend

      - name: Tests
        run: |
          if [ -d backend/tests ]; then
            pip install pytest httpx
            pytest backend/tests -v
          else
            echo "No backend tests in this checkout."
          fi

      - name: Alembic migration smoke test (temporary SQLite)
        run: |
          set -euo pipefail
          db_path="$(mktemp /tmp/seccraft-migration-XXXXXX.db)"
          export PLATFORM_DATABASE_URL="sqlite:///$db_path"
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini current
          alembic -c alembic.ini downgrade base
          rm -f "$db_path"
        working-directory: backend

  secrets:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fail if a .env file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "::error::A .env file is tracked — remove it and rotate the values."
            exit 1
          fi
          echo "No tracked .env files."

      - name: Fail if credentials, backups, exports, or runtime databases are tracked
        run: bash scripts/verify-no-sensitive-files-tracked.sh

      - name: Test prelaunch configuration, synthetic-token, and PostgreSQL version safeguards
        run: node --test scripts/tests/prelaunch-env.test.mjs scripts/tests/prelaunch-token.test.mjs scripts/tests/prelaunch-postgres-versions.test.mjs

  # The browser suites run as three parallel jobs. As one serial job they took over an hour, which left
  # almost no headroom under the timeout and made every push wait for all of it. Each job is independent;
  # the first keeps the original job id and name.
  browser-qa:
    name: Browser — responsive, accessibility and keyboard smoke
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/browser-qa/package-lock.json
      - run: npm ci --prefix frontend && npm ci --prefix tools/browser-qa
      - run: tools/browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Start frontend and await readiness
        run: |
          VITE_BASE=/ npm run dev --prefix frontend -- --host 0.0.0.0 --port 3000 > /tmp/seccraft-vite.log 2>&1 &
          tools/browser-qa/node_modules/.bin/wait-on --timeout 60000 http://127.0.0.1:3000
      - name: Layout and axe checks (offline service fixture)
        env:
          UI_AUDIT_MODULES: ${{ github.workspace }}/tools/browser-qa/node_modules
          UI_AUDIT_ROUTES: /,/login,/app,/modules,/modules/08-wpa-wpa2?tab=theory,/modules/08-wpa-wpa2?tab=lab&lab=lab-08-rsn,/reports,/settings,/feedback,/admin/feedback
          UI_AUDIT_WIDTHS: 320,1440
          UI_AUDIT_AXE: '1'
        run: node scripts/ui-responsive-audit.mjs
      - name: Keyboard, themes and short-screen interactions
        env:
          UI_AUDIT_MODULES: ${{ github.workspace }}/tools/browser-qa/node_modules
        run: node scripts/ui-keyboard-smoke.mjs
      - name: Feedback, color and motion interactions
        env:
          UI_AUDIT_MODULES: ${{ github.workspace }}/tools/browser-qa/node_modules
        run: |
          node scripts/ui-feedback-smoke.mjs
          node scripts/ui-feedback-owner-smoke.mjs
          node scripts/ui-color-states-smoke.mjs
          node scripts/ui-color-components-smoke.mjs
          node scripts/ui-motion-smoke.mjs
          node scripts/ui-learning-motion-smoke.mjs
          node scripts/ui-technical-motion-smoke.mjs
          node scripts/ui-secondary-motion-smoke.mjs
          node scripts/ui-product-polish-smoke.mjs
          node scripts/ui-path-scope-smoke.mjs
          node scripts/ui-motion-contract-smoke.mjs
      - name: Retain reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-qa
          path: .cache/ui-audit
          retention-days: 7

  browser-qa-lessons:
    name: Browser — Wireless and Android lessons (approved-learner fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/browser-qa/package-lock.json
      - run: npm ci --prefix frontend && npm ci --prefix tools/browser-qa
      - run: tools/browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Start frontend and await readiness
        run: |
          VITE_BASE=/ npm run dev --prefix frontend -- --host 0.0.0.0 --port 3000 > /tmp/seccraft-vite.log 2>&1 &
          tools/browser-qa/node_modules/.bin/wait-on --timeout 60000 http://127.0.0.1:3000
      # Lesson text is served only by the authenticated content API, so these runners install the
      # approved-learner fixture (scripts/lib/ui-audit-fixtures.mjs) instead of a blanket API outage.
      - name: Wireless and Android lesson interactions
        env:
          UI_AUDIT_MODULES: ${{ github.workspace }}/tools/browser-qa/node_modules
        run: |
          node scripts/ui-wireless-foundations-smoke.mjs
          node scripts/ui-wireless-phase2-smoke.mjs
          node scripts/ui-wireless-phase3-smoke.mjs
          node scripts/ui-wireless-phase4-smoke.mjs
          node scripts/ui-wireless-phase5-smoke.mjs
          node scripts/ui-wireless-phase6-smoke.mjs
          node scripts/ui-wireless-phase7-smoke.mjs
          node scripts/ui-wireless-curriculum-smoke.mjs
          node scripts/ui-android-curriculum-smoke.mjs
      - name: Retain reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-qa-lessons
          path: .cache/ui-audit
          retention-days: 7

  browser-qa-production:
    name: Browser — production subpath and offline downloads
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/browser-qa/package-lock.json
      - run: npm ci --prefix frontend && npm ci --prefix tools/browser-qa
      - run: tools/browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Wireless practice production subpath and offline downloads
        env:
          UI_AUDIT_MODULES: ${{ github.workspace }}/tools/browser-qa/node_modules
          UI_AUDIT_URL: http://localhost:4173/SecCraft
          UI_AUDIT_PRODUCTION: '1'
        run: |
          npm run build --prefix frontend
          node scripts/serve-pages-preview.mjs --port 4173 --base /SecCraft/ > /tmp/seccraft-pages.log 2>&1 &
          tools/browser-qa/node_modules/.bin/wait-on --timeout 60000 http://127.0.0.1:4173/SecCraft/
          node scripts/ui-wireless-foundations-smoke.mjs
          node scripts/ui-wireless-phase2-smoke.mjs
          node scripts/ui-wireless-phase3-smoke.mjs
          node scripts/ui-wireless-phase4-smoke.mjs
          node scripts/ui-wireless-phase5-smoke.mjs
          node scripts/ui-wireless-phase6-smoke.mjs
          node scripts/ui-wireless-phase7-smoke.mjs
          node scripts/ui-wireless-curriculum-smoke.mjs
          node scripts/ui-android-curriculum-smoke.mjs
      - name: Retain reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-qa-production
          path: .cache/ui-audit
          retention-days: 7

  postgres-concurrency:
    name: PostgreSQL — migrations, RLS and concurrent quotas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: seccraft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seccraft_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Check isolated-schema migrations and races
        env:
          PLATFORM_TEST_POSTGRES_URL: postgresql+psycopg://postgres:disposable-ci-only@localhost:5432/seccraft_test
        run: python backend/tests/postgres_concurrency_smoke.py
