name: Pre-launch Supabase validation

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable release ID (for example prelaunch-20261002-n1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seccraft-prelaunch-content
  cancel-in-progress: false

jobs:
  validate:
    name: Existing Supabase project — external validation
    runs-on: ubuntu-latest
    environment: prelaunch
    timeout-minutes: 45
    services:
      recovery-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: recovery
          POSTGRES_PASSWORD: recovery-only-disposable
          POSTGRES_DB: seccraft_recovery
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U recovery -d seccraft_recovery"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PLATFORM_ENV: prelaunch
      PLATFORM_DATABASE_URL: ${{ secrets.PRELAUNCH_DATABASE_URL }}
      CONTENT_MIGRATION_DATABASE_URL: ${{ secrets.PRELAUNCH_MIGRATION_DATABASE_URL }}
      CONTENT_BACKUP_DATABASE_URL: ${{ secrets.PRELAUNCH_BACKUP_DATABASE_URL }}
      CONTENT_DATABASE_RUNTIME_ROLE: ${{ vars.CONTENT_DATABASE_RUNTIME_ROLE }}
      PLATFORM_ALLOWED_ORIGINS: http://127.0.0.1:5173
      PLATFORM_AUTO_CREATE_TABLES: "false"
      PLATFORM_ENABLE_API_DOCS: "false"
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_AUDIENCE: authenticated
      SUPABASE_REQUIRE_VERIFIED_EMAIL: "true"
      CONTENT_STORAGE_BACKEND: supabase
      CONTENT_STORAGE_BUCKET: seccraft-content-staging
      CONTENT_IMPORT_ALLOW_NONLOCAL: "true"
      CONTENT_RELEASE_ID: ${{ inputs.release_id }}
      STAGING_API_URL: http://127.0.0.1:8000
      VITE_API_BASE: http://127.0.0.1:8000
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify secret and configuration presence without printing values
        env:
          PENDING_EMAIL: ${{ secrets.PRELAUNCH_PENDING_EMAIL }}
          PENDING_PASSWORD: ${{ secrets.PRELAUNCH_PENDING_PASSWORD }}
          APPROVED_NEW_EMAIL: ${{ secrets.PRELAUNCH_APPROVED_NEW_EMAIL }}
          APPROVED_NEW_PASSWORD: ${{ secrets.PRELAUNCH_APPROVED_NEW_PASSWORD }}
          APPROVED_PROGRESS_EMAIL: ${{ secrets.PRELAUNCH_APPROVED_PROGRESS_EMAIL }}
          APPROVED_PROGRESS_PASSWORD: ${{ secrets.PRELAUNCH_APPROVED_PROGRESS_PASSWORD }}
        run: bash scripts/validate-prelaunch-env.sh

      - name: Install validation dependencies
        run: |
          pip install -r backend/requirements.txt
          npm ci --prefix frontend

      - name: Obtain short-lived tokens for synthetic test accounts
        env:
          PENDING_EMAIL: ${{ secrets.PRELAUNCH_PENDING_EMAIL }}
          PENDING_PASSWORD: ${{ secrets.PRELAUNCH_PENDING_PASSWORD }}
          APPROVED_NEW_EMAIL: ${{ secrets.PRELAUNCH_APPROVED_NEW_EMAIL }}
          APPROVED_NEW_PASSWORD: ${{ secrets.PRELAUNCH_APPROVED_NEW_PASSWORD }}
          APPROVED_PROGRESS_EMAIL: ${{ secrets.PRELAUNCH_APPROVED_PROGRESS_EMAIL }}
          APPROVED_PROGRESS_PASSWORD: ${{ secrets.PRELAUNCH_APPROVED_PROGRESS_PASSWORD }}
        shell: bash
        run: bash scripts/acquire-prelaunch-tokens.sh

      - name: Start unchanged FastAPI binary locally
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/seccraft-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/seccraft-api.pid"

      - name: Run external PostgreSQL, Storage, Auth, importer and leak validation
        run: bash tools/content/run_external_staging.sh

      - name: Validate N/N+1, concurrent activation, rollback and content update without backend restart
        run: python tools/content/validate_external_lifecycle.py

      - name: Validate pending, no-history and existing-progress compatibility
        run: python tools/content/verify_external_progress.py

      # Runner images ship only one PostgreSQL major (16 on ubuntu-24.04), so pg_dump/pg_restore
      # would otherwise be older than the PostgreSQL 17 servers this workflow dumps and restores.
      # Install the 17 client toolchain when missing and put its bin directory first on PATH for
      # every later step, ahead of the backup. Fails closed when the binaries remain unavailable.
      - name: Pin PostgreSQL 17 client tools for pg_dump and pg_restore
        run: |
          set -euo pipefail
          pg17_bin=/usr/lib/postgresql/17/bin
          if [[ ! -x "$pg17_bin/pg_dump" || ! -x "$pg17_bin/pg_restore" ]]; then
            echo "PostgreSQL 17 client tools are not preinstalled; installing postgresql-client-17 from the PGDG apt repository."
            codename="$(. /etc/os-release && printf '%s' "${VERSION_CODENAME:?missing VERSION_CODENAME in /etc/os-release}")"
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            sudo sh -c "echo \"deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main\" > /etc/apt/sources.list.d/pgdg.list"
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17
          fi
          "$pg17_bin/pg_dump" --version
          "$pg17_bin/pg_restore" --version
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      # Fail-closed client/server major-version diagnostic: blocks the backup unless pg_dump,
      # pg_restore, and psql plus the staging and disposable recovery servers all report major 17.
      # Read-only (SHOW server_version_num); never prints either database URL.
      - name: Verify PostgreSQL 17 client/server major versions before backup
        env:
          CONTENT_RECOVERY_DATABASE_URL: postgresql://recovery:recovery-only-disposable@127.0.0.1:55432/seccraft_recovery
        run: bash scripts/verify-prelaunch-postgres-versions.sh 17

      - name: Back up existing Supabase content and restore to disposable PostgreSQL/filesystem
        env:
          CONTENT_RECOVERY_DATABASE_URL: postgresql://recovery:recovery-only-disposable@127.0.0.1:55432/seccraft_recovery
          CONTENT_RECOVERY_STORAGE_ROOT: ${{ runner.temp }}/seccraft-recovery-storage
        run: |
          backup="$RUNNER_TEMP/seccraft-prelaunch-backup"
          python tools/content/backup_external_staging.py backup "$backup"
          python tools/content/backup_external_staging.py restore "$backup"
          test -s "$backup/database.dump"
          test -s "$backup/objects.json"
          rm -rf "$backup" "$CONTENT_RECOVERY_STORAGE_ROOT"

      - name: Confirm no secret-bearing artifacts are retained
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/seccraft-prelaunch-backup" "$RUNNER_TEMP/seccraft-recovery-storage"
          bash scripts/verify-no-sensitive-files-tracked.sh

      - name: Show API diagnostics on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/seccraft-api.log" | sed -E 's#(postgres(ql)?(\+psycopg)?://)[^[:space:]]+#\1[REDACTED]#g'
