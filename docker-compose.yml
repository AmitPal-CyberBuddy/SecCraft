version: '3.8'
services:
  wififorge:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      # Required: the API refuses to issue tokens when this is unset (no default secret ships).
      - WIFIFORGE_JWT_SECRET=${WIFIFORGE_JWT_SECRET:?set WIFIFORGE_JWT_SECRET in the environment}
      - WIFIFORGE_ALLOWED_ORIGINS=${WIFIFORGE_ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - ./data:/app/data:ro
      - evidence:/app/evidence
      - logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - wififorge-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - wififorge
    restart: unless-stopped
    networks:
      - wififorge-net

volumes:
  evidence:
    driver: local
  logs:
    driver: local

networks:
  wififorge-net:
    driver: bridge
